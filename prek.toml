[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all -- --check", language = "system", types = ["rust"], stages = ["commit"], pass_filenames = false },
  { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --all-targets -- -D warnings", language = "system", types = ["rust"], stages = ["commit"], pass_filenames = false },
  { id = "cargo-test", name = "cargo test", entry = "cargo test --all-targets", language = "system", types = ["rust"], stages = ["commit"], pass_filenames = false },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [
  { id = "actionlint", name = "actionlint", entry = "actionlint", language = "system", types = ["yaml"], files = "\\.github/workflows/.*\\.ya?ml$", stages = ["commit"] },
]
