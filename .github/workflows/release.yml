name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust environment
        uses: ./.github/actions/setup-rust

      - name: Run tests
        run: cargo test --all-targets

      - name: Build release binaries
        run: cargo build --release --all-targets

      - name: Package binaries as .deb
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          PKG_NAME="lincrusta"
          mkdir -p deb-package/DEBIAN
          mkdir -p deb-package/usr/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/usr/share/doc/"$PKG_NAME"

          # Copy binaries
          cp target/release/wallpaperd deb-package/usr/bin/
          cp target/release/wallpaper-cli deb-package/usr/bin/

          # Create control file
          cat > deb-package/DEBIAN/control << EOF
          Package: $PKG_NAME
          Version: $VERSION
          Architecture: amd64
          Maintainer: Andrew <andrew@example.com>
          Description: Wallpaper daemon and CLI for Wayland
           Depends: libgtk-4-1 (>= 4.10), libglib2.0-0 (>= 2.76), libdbus-1-3 (>= 1.14), libgtk4-layer-shell0 (>= 1.0)
          Section: utils
          Priority: optional
          Homepage: https://github.com/${{ github.repository }}
          EOF

          # Create copyright file
          cat > deb-package/usr/share/doc/"$PKG_NAME"/copyright << EOF
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Upstream-Name: $PKG_NAME
          Source: https://github.com/${{ github.repository }}

          Files: *
          Copyright: 2024 drewrm
          License: GPL-2
          EOF

          # Create changelog
          cat > deb-package/usr/share/doc/"$PKG_NAME"/changelog.Debian << EOF
          $PKG_NAME ($VERSION-1) unstable; urgency=medium
            * New upstream release
          EOF

          # Build the package
          dpkg-deb --build deb-package "${PKG_NAME}_${VERSION}-1_amd64.deb"
          echo "DEB_FILE=${PKG_NAME}_${VERSION}-1_amd64.deb" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DEB_FILE }}
          generate_release_notes: true
