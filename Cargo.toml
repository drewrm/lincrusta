[package]
name = "wallpaper"
version = "0.1.1"
edition = "2024"
description = "Wallpaper daemon and CLI for Wayland"
license = "GPL-2.0-only"
repository = "https://github.com/drewrm/wallpaper"
homepage = "https://github.com/drewrm/wallpaper"
categories = ["command-line-utilities", "desktop-environment"]
keywords = ["wallpaper", "wayland", "gtk4", "daemon"]

[[bin]]
name = "wallpaperd"
path = "src/bin/wallpaperd.rs"

[[bin]]
name = "wallpaper-cli"
path = "src/bin/wallpaper.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
zbus = "5"
toml_edit = "0.25"
env_logger = "0.11.9"
log = "0.4.32"
rand = "0.10.1"

[dev-dependencies]
tempfile = "3"
serial_test = "4.0"

[profile.test]
opt-level = 0
